set -g base-index 1
set -g default-terminal "tmux-256color"
set -g escape-time 1
set -g focus-follows-mouse on
set -g history-limit 1024
set -g message-style bg=colour3,fg=colour0
set -g mode-keys vi
set -g mode-style bg=colour3,fg=colour0
set -g mouse on
set -g pane-active-border-style fg=colour8
set -g pane-base-index 1
set -g pane-border-format "#{?pane_active,#[bg=colour8],}#[fg=colour7] #{?@pane_name,#{@pane_name},#{pane_current_command}} "
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style fg=colour8
set -g prefix `
set -g status on
set -g status-bg colour0
set -g status-fg colour7
set -g status-left "#[fg=colour4]λ "
set -g status-right "#(status) #[fg=colour1]#S"
set -g status-right-length 80
set -g window-status-current-format "#[bg=colour8,nounderscore] #W "
set -g window-status-format " #W "
set -g window-status-separator ""

bind-key b set -g status
bind-key e command-prompt -I "#{@pane_name}" -p "name" { set-option -p @pane_name "%%" }
bind-key j command-prompt -p "join pane from:" { join-pane -s "%%" }
bind-key k send-keys -R C-l \; clear-history
bind-key m set -g mouse
bind-key R source-file ~/.tmux.conf
bind-key Tab last-window
bind-key ` send-prefix
bind-key '{' swap-pane -U
bind-key '}' swap-pane -D

bind-key -n F1 resize-pane -Z

source-file ~/src/sys/tmux/conf
