[colors.bright]
black   = "#262626"
red     = "#fd5e53"
green   = "#50c878"
yellow  = "#e6db74"
blue    = "#318ce7"
magenta = "#fd3f92"
cyan    = "#50d8d8"
white   = "#f8f8f2"

[colors.cursor]
cursor = "#f8f8f2"
text = "#121212"

[colors.normal]
black   = "#121212"
red     = "#fd5e53"
green   = "#50c878"
yellow  = "#e6db74"
blue    = "#318ce7"
magenta = "#fd3f92"
cyan    = "#50d8d8"
white   = "#f8f8f2"

[colors.primary]
background = "#121212"
foreground = "#f8f8f2"

[debug]
log_level = "Error"

[font]
size = 12.0

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
]

[window]
dynamic_title = false
title = "Alacritty Terminal"
